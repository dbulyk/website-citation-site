<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Website Citation | Why have you deleted the app?</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #f6f7f9;
      color: #1a1a1a;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 8px;
    }
    p.lead {
      margin: 0 0 20px;
      color: #555;
      line-height: 1.45;
    }
    .frame {
      background: #fff;
      border: 1px solid #e3e5e8;
      border-radius: 12px;
      overflow: hidden;
      min-height: 520px;
    }
    iframe {
      display: block;
      width: 100%;
      height: 560px;
      border: 0;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #121417; color: #f2f2f2; }
      p.lead { color: #aaa; }
      .frame { background: #1b1e24; border-color: #2a2f38; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Website Citation</h1>
    <p class="lead">Sorry to see you go. One short question helps us improve the extension.</p>
    <div class="frame">
      <iframe
        title="Why have you deleted the app?"
        src="https://docs.google.com/forms/d/e/1FAIpQLSdRpK2d22g2Irsa7PIZERjYVa_Z1jxGps3NaAgeR7apfhmE3A/viewform?embedded=true"
        loading="lazy"
        allow="clipboard-write"
      ></iframe>
    </div>
  </main>
</body>
</html>
